name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ruff check
        run: uv run ruff check src tests bench
      - name: ruff format
        run: uv run ruff format --check src tests bench

  unit:
    name: unit / py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: unit tests
        run: uv run pytest tests/unit -q

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: integration tests
        run: uv run pytest tests/integration -q
      - name: cli smoke test
        run: |
          uv run kinu ingest examples/3-docs --data "$RUNNER_TEMP/data"
          uv run kinu query "how many pto days do i get" --data "$RUNNER_TEMP/data" --limit 1

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: pytest with coverage floor
        run: |
          uv run pytest -q \
            --cov=kinu \
            --cov-report=term-missing \
            --cov-fail-under=80 | tee coverage.txt
      - name: summary
        if: always()
        run: |
          {
            echo "### coverage"
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.txt

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv build
      - name: built artifacts
        run: ls -l dist/
      - name: install the wheel and run the demo
        run: |
          uv venv "$RUNNER_TEMP/check"
          VIRTUAL_ENV="$RUNNER_TEMP/check" uv pip install dist/*.whl
          "$RUNNER_TEMP/check/bin/kinu" demo | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
