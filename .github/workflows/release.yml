name: release

on:
  push:
    tags: ["v0.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: version is 0.x and matches the tag
        run: |
          uv run python -c "
          import pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          tag = '${GITHUB_REF_NAME}' if '${GITHUB_REF_TYPE}' == 'tag' else ''
          major = version.split('.')[0]
          assert major == '0', f'still pre-1.0, got {version}'
          assert not tag or tag == 'v' + version, f'tag {tag} does not match version {version}'
          print(f'version {version} tag {tag or \"(none)\"}')
          "

      - run: uv build

      - name: sdist and wheel
        run: ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish
    needs: build
    # Only tags, and only 0.x. Pushing to main must never publish anything.
    if: startsWith(github.ref, 'refs/tags/v0.')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kinu
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: publish to pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    name: github release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v0.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --prerelease
