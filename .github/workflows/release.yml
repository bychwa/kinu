name: release

on:
  push:
    tags: ["v0.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: version is 0.x and matches the tag
        run: |
          uv run python -c "
          import pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          tag = '${GITHUB_REF_NAME}' if '${GITHUB_REF_TYPE}' == 'tag' else ''
          major = version.split('.')[0]
          assert major == '0', f'still pre-1.0, got {version}'
          assert not tag or tag == 'v' + version, f'tag {tag} does not match version {version}'
          print(f'version {version} tag {tag or \"(none)\"}')
          "

      - run: uv build

      - name: sdist and wheel
        run: ls -l dist/

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: publish
    needs: build
    # Only tags, and only 0.x. Pushing to main must never publish anything.
    # Publishing is opt-in until the PyPI trusted publisher exists: set the
    # repository variable PYPI_PUBLISH=true once pypi.org knows about this
    # repo, workflow and environment.
    if: startsWith(github.ref, 'refs/tags/v0.') && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kinu
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: publish to pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    name: github release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v0.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: create or refresh the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # The tag already has a release — it was moved, e.g. a history
            # rewrite. Keep the written notes, just refresh the artifacts.
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --prerelease
          fi
