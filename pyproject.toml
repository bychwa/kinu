[project]
name = "kinu"
version = "0.1.0"
description = "Vector + text search on object storage."
readme = "README.md"
authors = [
    { name = "Jackson Isack", email = "jackson.mrema@danads.se" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.0",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.32",
]

[project.urls]
Homepage = "https://github.com/bychwa/kinu"

[project.scripts]
kinu = "kinu.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["kinu"]
branch = true

[tool.coverage.report]
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
