[project]
name = "kinu"
version = "0.1.0"
description = "Vector + text search on object storage. Three roundtrips, no server."
readme = "README.md"
authors = [
    { name = "Jackson Isack", email = "jackson.mrema@danads.se" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.0",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.32",
]

[project.urls]
Homepage = "https://github.com/kinu-dev/kinu"

[project.scripts]
kinu = "kinu.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
